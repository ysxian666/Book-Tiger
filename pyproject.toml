[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiger-amazon2023-overnight"
version = "0.2.0"
description = "RTX 5090 overnight reproduction and optimization of TIGER on Amazon Reviews 2023 Books"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.7",
  "transformers>=4.48",
  "duckdb>=1.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "tqdm>=4.66"
]

[project.scripts]
tiger-overnight = "tiger_overnight.pipeline_cli:main"

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["tests"]
